{{ define "main" }}
<section class="site-hero">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    <p>{{ .Params.intro }}</p>
  </div>
</section>

{{ with .Content }}
<section class="section">
  <div class="wrap prose">{{ . }}</div>
</section>
{{ end }}

{{ with .Params.directions }}
<section class="section">
  <div class="wrap">
    {{ range . }}
      <article class="people-group">
        <h2>{{ .title }}</h2>
        <div class="prose"><p>{{ .summary }}</p></div>
      </article>
    {{ end }}
  </div>
</section>
{{ end }}
{{ end }}
