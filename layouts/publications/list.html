{{ define "main" }}
{{ $pubs := .Params.featured }}
<section class="site-hero">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    <p>{{ .Params.intro }}</p>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <ul class="pub-list">
      {{ range $pubs }}
        <li>
          <span class="pub-title">{{ .title }}</span>
          <span class="pub-meta">{{ .authors }} · {{ .venue }}{{ with .arxiv }} · <a href="https://arxiv.org/abs/{{ . }}">arXiv:{{ . }}</a>{{ end }}</span>
        </li>
      {{ end }}
    </ul>
    <div class="prose" style="margin-top:32px">{{ $.Content }}</div>
  </div>
</section>
{{ end }}
